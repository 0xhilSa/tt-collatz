# Tiny Tapeout project information
project:
  title:        "Collatz Conjecture Accelerator"
  author:       "Sahil Rajwar"
  discord:      "0xhilsa"
  description:  "Hardware accelerator for the Collatz conjecture"
  language:     "Verilog"
  clock_hz:     10000000

  tiles: "1x1"

  top_module:  "tt_um_collatz_0xhilSa"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "data bit 0"
  ui[1]: "data bit 1"
  ui[2]: "data bit 2"
  ui[3]: "data bit 3"
  ui[4]: "data bit 4"
  ui[5]: "data bit 5"
  ui[6]: "data bit 6"
  ui[7]: "data bit 7"
  # Outputs
  uo[0]: "stopping time bit 0 (LSB)"
  uo[1]: "stopping time bit 1"
  uo[2]: "stopping time bit 2"
  uo[3]: "stopping time bit 3"
  uo[4]: "stopping time bit 4"
  uo[5]: "stopping time bit 5"
  uo[6]: "stopping time bit 6"
  uo[7]: "stopping time bit 7 (MSB)"
  # Bidirectional pins
  uio[0]: "load_high: 0=load low byte of n, 1=load high byte of n (input)"
  uio[1]: "start: pulse high for 1 cycle to begin iteration (input)"
  uio[2]: "done: goes high when stopping time is ready (output)"
  uio[3]: "overflow: high if trajectory exceeded 24-bit register (output)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
